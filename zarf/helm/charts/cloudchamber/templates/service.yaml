apiVersion: v1
kind: Service
metadata:
  name: cloudchamber-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cloudchamber.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "cloudchamber.selectorLabels" . | nindent 4 }}
  ports:
    - name: cloudchamber
      port: {{ .Values.service.ports.http }}
      targetPort: cloudchamber
    - name: cloudchamber-debug
      port: {{ .Values.service.ports.debug }}
      targetPort: cloudchamber-debug
    - name: metrics
      port: {{ .Values.service.ports.metricsHttp }}
      targetPort: metrics
    - name: metrics-debug
      port: {{ .Values.service.ports.metricsDebug }}
      targetPort: metrics-debug
    - name: prometheus
      port: {{ .Values.service.ports.metricsPrometheus }}
      targetPort: metrics-prom
