apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: cloudchamber-system

spec:
  replicas: 1

  strategy:
    type: Recreate

  template:
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true

      containers:
        - name: auth
          env:
            - name: AUTH_GOOGLE_CALLBACK_BASE
              value: http://127.0.0.1:6100
          resources:
            requests:
              cpu: "100m"
            limits:
              cpu: "1000m"
