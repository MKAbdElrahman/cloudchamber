apiVersion: v1
kind: Service
metadata:
  name: cloudchamber-service
  namespace: cloudchamber-system

spec:
  type: ClusterIP

  ports:
    - name: cloudchamber
      port: 3000
      targetPort: cloudchamber
    - name: cloudchamber-debug
      port: 3010
      targetPort: cloudchamber-debug
    - name: metrics
      port: 4000
      targetPort: metrics
    - name: metrics-debug
      port: 4010
      targetPort: metrics-debug
    - name: prometheus
      port: 4020
      targetPort: metrics-prom
