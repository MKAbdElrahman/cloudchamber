apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/cloudchamber/
  - ./dev-cloudchamber-configmap.yaml
patches:
  - path: ./dev-cloudchamber-patch-deploy.yaml
  - path: ./dev-cloudchamber-patch-service.yaml
images:
  - name: cloudchamber-image
    newName: localhost/cloudchamber/cloudchamber
    newTag: 0.0.1
  - name: metrics-image
    newName: localhost/cloudchamber/metrics
    newTag: 0.0.1
