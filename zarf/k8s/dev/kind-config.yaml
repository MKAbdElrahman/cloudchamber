kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # CloudChamber
      - containerPort: 3000
        hostPort: 3000
      # CloudChamber debug
      - containerPort: 3010
        hostPort: 3010
      # Metrics
      - containerPort: 4000
        hostPort: 4000
      # Metrics debug
      - containerPort: 4010
        hostPort: 4010
      # Metrics Prometheus
      - containerPort: 4020
        hostPort: 4020
      # Auth. The process stays on 6000 inside the cluster. The laptop
      # port is 6100 because Chrome refuses to open port 6000.
      - containerPort: 6000
        hostPort: 6100
      # Auth debug
      - containerPort: 6010
        hostPort: 6010
      # Grafana
      - containerPort: 3100
        hostPort: 3100
      # Postgres
      - containerPort: 5432
        hostPort: 5432
      # Prometheus
      - containerPort: 9090
        hostPort: 9090
      # Tempo (tracing)
      - containerPort: 9411
        hostPort: 9411
      # Temporal frontend (gRPC)
      - containerPort: 7233
        hostPort: 7233
      # Temporal UI
      - containerPort: 8080
        hostPort: 8080
      # SeaweedFS S3
      - containerPort: 8333
        hostPort: 8333
      # tusd (resumable uploads)
      - containerPort: 8180
        hostPort: 8180
      # LiteLLM proxy + admin UI (host 4100; metrics uses 4000)
      - containerPort: 4100
        hostPort: 4100
      # Langfuse UI (host 3300; API uses 3000 inside the cluster)
      - containerPort: 3300
        hostPort: 3300
      # Langfuse SeaweedFS S3 (app SeaweedFS uses 8333)
      - containerPort: 8343
        hostPort: 8343
