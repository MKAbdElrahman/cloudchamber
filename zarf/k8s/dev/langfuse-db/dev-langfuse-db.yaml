apiVersion: v1
kind: Namespace
metadata:
  name: langfuse-system
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: langfuse-postgres-data
  namespace: langfuse-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: langfuse-postgres
  namespace: langfuse-system
spec:
  selector:
    matchLabels:
      app: langfuse-postgres
  serviceName: langfuse-postgres-service
  replicas: 1
  template:
    metadata:
      labels:
        app: langfuse-postgres
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:18.6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          env:
            - name: POSTGRES_USER
              value: langfuse
            # Keep in sync with langfuse-secret postgres_password (langfuse applies after DB).
            - name: POSTGRES_PASSWORD
              value: langfuse
            - name: POSTGRES_DB
              value: langfuse
          ports:
            - name: postgres
              containerPort: 5432
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -h
                - localhost
                - -U
                - langfuse
                - -d
                - langfuse
            initialDelaySeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -h
                - localhost
                - -U
                - langfuse
                - -d
                - langfuse
            initialDelaySeconds: 5
            timeoutSeconds: 1
          resources:
            requests:
              cpu: 100m
            limits:
              cpu: 3400m
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: langfuse-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-postgres-service
  namespace: langfuse-system
spec:
  type: ClusterIP
  selector:
    app: langfuse-postgres
  ports:
    - port: 5432
      targetPort: postgres