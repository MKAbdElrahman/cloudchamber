# Dev credentials (KIND only). Matches docker-compose # CHANGEME semantics; not for production.
# SALT / NEXTAUTH_SECRET: openssl rand -base64 32 (dev-fixed). ENCRYPTION_KEY: openssl rand -hex 32.
# Keep DATABASE_URL password in sync with langfuse-postgres.
apiVersion: v1
kind: Secret
metadata:
  name: langfuse-secret
  namespace: langfuse-system
type: Opaque
stringData:
  DATABASE_URL: postgresql://langfuse:langfuse@langfuse-postgres-service:5432/langfuse
  DIRECT_URL: postgresql://langfuse:langfuse@langfuse-postgres-service:5432/langfuse
  SALT: k8sLangfuseDevSaltReplaceInProdWithOpensslBase64==
  NEXTAUTH_SECRET: k8sLangfuseDevNextAuthReplaceInProdWithOpenssl==
  ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  CLICKHOUSE_PASSWORD: clickhouse
  REDIS_AUTH: langfuse-redis-dev
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse-s3
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: langfuse-seaweedfs-dev
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: langfuse-s3
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: langfuse-seaweedfs-dev
  LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-cloudchamber-kind-dev
  LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-cloudchamber-kind-dev
  LANGFUSE_INIT_USER_PASSWORD: langfuse-dev