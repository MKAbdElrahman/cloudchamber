apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: litellm-database-data
  namespace: cloudchamber-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: litellm-database
  namespace: cloudchamber-system
spec:
  selector:
    matchLabels:
      app: litellm-database
  serviceName: litellm-database-service
  replicas: 1
  template:
    metadata:
      labels:
        app: litellm-database
    spec:
      terminationGracePeriodSeconds: 60
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: litellm-database-data
        - name: config
          configMap:
            name: litellm-pghbaconf
            items:
              - key: "pg_hba.conf"
                path: "pg_hba.conf"
      containers:
        - name: postgres
          image: postgres:18.6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/18/docker
            - name: config
              readOnly: false
              mountPath: "/etc/pg_hba.conf"
              subPath: "pg_hba.conf"
          args: ["-c", "hba_file=/etc/pg_hba.conf"]
          resources:
            requests:
              cpu: 100m
            limits:
              cpu: 3400m
          env:
            - name: POSTGRES_USER
              value: litellm
            # Keep in sync with litellm-secret db_password (litellm-db applies before that Secret exists).
            - name: POSTGRES_PASSWORD
              value: litellm
            - name: POSTGRES_DB
              value: litellm
          ports:
            - name: postgres
              containerPort: 5432
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -h
                - localhost
                - -U
                - litellm
                - -d
                - litellm
            initialDelaySeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -h
                - localhost
                - -U
                - litellm
                - -d
                - litellm
            initialDelaySeconds: 5
            timeoutSeconds: 1
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-database-service
  namespace: cloudchamber-system
spec:
  type: ClusterIP
  selector:
    app: litellm-database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-pghbaconf
  namespace: cloudchamber-system
data:
  pg_hba.conf: |
    local   all             all                                     trust
    # IPv4 local connections:
    host    all             all             0.0.0.0/0               trust
    # IPv6 local connections:
    host    all             all             ::1/128                 trust
    # Allow replication connections from localhost, by a user with the
    # replication privilege.
    local   replication     all                                     trust
    host    replication     all             0.0.0.0/0               trust
    host    replication     all             ::1/128                 trust