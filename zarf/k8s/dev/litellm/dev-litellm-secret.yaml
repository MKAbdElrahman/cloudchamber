# Dev credentials (KIND only). Keep db_password in sync with litellm-database POSTGRES_PASSWORD.
apiVersion: v1
kind: Secret
metadata:
  name: litellm-secret
  namespace: litellm-system
type: Opaque
stringData:
  db_password: litellm
  database_url: postgresql://litellm:litellm@litellm-database-service:5432/litellm
  master_key: sk-cloudchamber-litellm-dev
  salt_key: sk-cloudchamber-litellm-dev-salt
  ui_password: litellm-dev
  # Same project keys as langfuse-system headless init (langfuse-secret).
  langfuse_public_key: pk-lf-cloudchamber-kind-dev
  langfuse_secret_key: sk-lf-cloudchamber-kind-dev