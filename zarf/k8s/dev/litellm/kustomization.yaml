apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./dev-litellm-configmap.yaml
  - ./dev-litellm-secret.yaml
  - ./dev-litellm.yaml
# Keep newTag in sync with LITELLM in the makefile.
images:
  - name: litellm-image
    newName: docker.litellm.ai/berriai/litellm
    newTag: v1.111.0
  - name: postgres
    newName: postgres
    newTag: "18.6"