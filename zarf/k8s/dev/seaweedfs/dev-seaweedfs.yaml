apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
  namespace: cloudchamber-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: cloudchamber-system
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seaweedfs
  replicas: 1
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: seaweedfs-data
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:latest
          args:
            - mini
            - -dir=/data
            - -ip.bind=0.0.0.0
          env:
            - name: AWS_ACCESS_KEY_ID
              value: admin
            - name: AWS_SECRET_ACCESS_KEY
              value: seaweedfs-dev
            - name: S3_BUCKET
              value: cloudchamber-artifacts
          ports:
            - name: s3
              containerPort: 8333
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-service
  namespace: cloudchamber-system
spec:
  type: ClusterIP
  selector:
    app: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: s3
