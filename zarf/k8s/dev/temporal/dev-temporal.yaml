apiVersion: v1
kind: ConfigMap
metadata:
  name: temporal-dynamic-config
  namespace: temporal-system
data:
  dynamic.yaml: |
    frontend.WorkflowPauseEnabled:
      - value: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-server
  namespace: temporal-system
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: temporal-server
  replicas: 1
  template:
    metadata:
      labels:
        app: temporal-server
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      initContainers:
        - name: init-temporal-visibility-db
          image: postgres:18.6
          env:
            - name: PGPASSWORD
              value: temporal
          command:
            - sh
            - -c
            - |
              set -eu
              until pg_isready -h temporal-database-service -U temporal -d temporal; do
                echo "waiting for temporal-database-service"
                sleep 2
              done
              psql -h temporal-database-service -U temporal -d temporal -v ON_ERROR_STOP=1 <<'SQL'
              SELECT 'CREATE DATABASE temporal_visibility'
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'temporal_visibility')\gexec
              SQL
        - name: init-temporal-schema
          image: temporalio/admin-tools:1.32.2
          env:
            - name: SQL_PLUGIN
              value: postgres12
            - name: SQL_HOST
              value: temporal-database-service
            - name: SQL_PORT
              value: "5432"
            - name: SQL_USER
              value: temporal
            - name: SQL_PASSWORD
              value: temporal
          command:
            - sh
            - -c
            - |
              set -eu
              schema=/etc/temporal/schema/postgresql/v12
              temporal-sql-tool --database temporal setup-schema -v 0.0
              temporal-sql-tool --database temporal update-schema -d "$schema/temporal/versioned"
              temporal-sql-tool --database temporal_visibility setup-schema -v 0.0
              temporal-sql-tool --database temporal_visibility update-schema -d "$schema/visibility/versioned"
      containers:
        - name: temporal-server
          image: temporalio/server:1.32.2
          ports:
            - name: frontend
              containerPort: 7233
          env:
            - name: DB
              value: postgres12
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_SEEDS
              value: temporal-database-service
            - name: POSTGRES_USER
              value: temporal
            - name: POSTGRES_PWD
              value: temporal
            - name: DBNAME
              value: temporal
            - name: VISIBILITY_DBNAME
              value: temporal_visibility
            - name: BIND_ON_IP
              value: 0.0.0.0
            - name: DYNAMIC_CONFIG_FILE_PATH
              value: /etc/temporal/dynamic/dynamic.yaml
          volumeMounts:
            - name: dynamic-config
              mountPath: /etc/temporal/dynamic
          readinessProbe:
            tcpSocket:
              port: frontend
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: frontend
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
        # The server image does not register a namespace. This container registers
        # "default" and reports ready once it exists, so the pod is ready only then.
        - name: temporal-namespace
          image: temporalio/admin-tools:1.32.2
          command:
            - sh
            - -c
            - |
              until temporal operator namespace describe --namespace default --address 127.0.0.1:7233 >/dev/null 2>&1 \
                || temporal operator namespace create --namespace default --retention 72h --address 127.0.0.1:7233; do
                echo "waiting for temporal frontend"
                sleep 2
              done
              touch /tmp/ready
              trap exit INT HUP TERM
              sleep infinity &
              wait
          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/ready"]
            periodSeconds: 2
      volumes:
        - name: dynamic-config
          configMap:
            name: temporal-dynamic-config
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-server-service
  namespace: temporal-system
spec:
  type: ClusterIP
  selector:
    app: temporal-server
  ports:
    - name: frontend
      port: 7233
      targetPort: frontend
