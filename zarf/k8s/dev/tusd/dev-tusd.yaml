apiVersion: apps/v1
kind: Deployment
metadata:
  name: tusd
  namespace: cloudchamber-system
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tusd
  replicas: 1
  template:
    metadata:
      labels:
        app: tusd
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      containers:
        - name: tusd
          image: tusproject/tusd:latest
          args:
            - -host=0.0.0.0
            - -port=8180
            - -base-path=/files/
            - -s3-bucket=cloudchamber-artifacts
            - -s3-endpoint=http://seaweedfs-service:8333
            - -hooks-http=http://cloudchamber-service:3000/v1/internal/tusd/hooks
            - -hooks-http-forward-headers=Authorization,traceparent,tracestate,baggage
            - -hooks-enabled-events=pre-create,pre-finish,post-terminate
            - -behind-proxy
          env:
            - name: AWS_ACCESS_KEY_ID
              value: admin
            - name: AWS_SECRET_ACCESS_KEY
              value: seaweedfs-dev
            - name: AWS_REGION
              value: us-east-1
          ports:
            - name: http
              containerPort: 8180
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: tusd-service
  namespace: cloudchamber-system
spec:
  type: ClusterIP
  selector:
    app: tusd
  ports:
    - name: http
      port: 8180
      targetPort: http
